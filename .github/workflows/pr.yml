name: pr/push checks

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  id-token: write

jobs:

  build:
    name: Build, Test, Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26.5'

    - name: Lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.12.2

    - name: Build
      run: go build -v ./...

    - name: Test & Coverage
      run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        fail_ci_if_error: true
        files: ./coverage.out
        use_oidc: true
